name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  mobile:
    # The phone client's only automated gate — 156 jest tests, tsc strict,
    # expo lint. No Android SDK needed: the suites run on the jest-expo
    # preset with inert stand-ins for the native modules (jest.setup.js);
    # the pixel-level proofs stay in mobile/renders/ on the device.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
        env:
          CI: 1

  greps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: blur budget (<=1 backdrop-filter per screen route)
        run: scripts/lint_greps.sh blur
      - name: accent hexes only in theme.css
        run: scripts/lint_greps.sh accent
      - name: chokepoint (no agent transport outside agent_invoke.py)
        run: scripts/lint_greps.sh chokepoint

  lint-selfcheck:
    # T0.6: a lint rule with no failing fixture is a lint rule nobody has
    # proven fires. Each fixture must fail; the clean tree must pass — both
    # in one step, so a regex that silently stops matching turns this red.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint_greps.sh selfcheck

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  greps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: blur budget (<=1 backdrop-filter per screen route)
        run: scripts/lint_greps.sh blur
      - name: accent hexes only in theme.css
        run: scripts/lint_greps.sh accent
      - name: chokepoint (no agent transport outside agent_invoke.py)
        run: scripts/lint_greps.sh chokepoint

<svg xmlns="http://www.w3.org/2000/svg" width="420" height="420" viewBox="0 0 420 420" role="presentation">
  <!-- The matte skin's texture (01-design-system.md §2 L0).

       Matched to the ratified reference render by MEASUREMENT. Sampling an
       open black patch of it gives: mean 12.5, std 6.0, dominant feature
       size about 6.7px. That is a fine dense crinkle — crumpled tissue,
       close-grained — and it is nearly black.

       Earlier passes built big soft folds (80px features) at std 14, which
       read as lighting on a grey field rather than as black stock. The
       character was wrong before the amplitude was, so this is one dominant
       crinkle at the reference's own scale plus a whisper of finer tooth.

       Both layers are ZERO-MEAN, which is what keeps the skin black.
       feDiffuseLighting returns sin(elevation) across flat ground — 0.848,
       not 0.5 — so a transfer centred on 0.5 lifts the whole field toward
       grey. Each layer maps its own flat value to black instead: flat
       ground contributes nothing over a near-black base, and only crinkle
       ridges carry any light.

       STATIC, always: no SMIL animation elements, no CSS keyframes, no seed
       that varies between renders. This asset is texture, not a screensaver.
       (Gate 4 is a plain string match, so even naming the banned construct
       in a comment trips it — as it should; the gate stays dumb.)

       (Token names are written bare in these comments on purpose: a double
       hyphen is illegal inside an XML comment and silently malforms the
       whole asset, which then renders as nothing at all. That shipped once,
       2026-10-10; grain.test.ts now parses the file to catch it.) -->
  <defs>
    <filter id="eudaimonia-crinkle" x="0" y="0" width="100%" height="100%">
      <!-- baseFrequency 0.15 puts the dominant feature at ~6.7px, which is
           what the reference measures. numOctaves 3 gives the crinkle its
           irregular cell shapes without drifting into static. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.30" numOctaves="3" seed="7" stitchTiles="stitch" result="folds"/>
      <feDiffuseLighting in="folds" surfaceScale="1.4" diffuseConstant="1" lightingColor="#ffffff" result="lit">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feColorMatrix in="lit" type="saturate" values="0" result="grey"/>
      <!-- Flat ground maps to black; only ridges tilted into the light show. -->
      <feComponentTransfer in="grey">
        <feFuncR type="linear" slope="6.0" intercept="-5.088"/>
        <feFuncG type="linear" slope="6.0" intercept="-5.088"/>
        <feFuncB type="linear" slope="6.0" intercept="-5.088"/>
      </feComponentTransfer>
    </filter>
    <filter id="eudaimonia-broad" x="0" y="0" width="100%" height="100%">
      <!-- A whisper of broad shading under the crinkle. Without it the
           texture dies away under downsampling faster than the reference
           does (std 0.7 vs 2.6 at 8x): real stock has gentle wide variation
           as well as close grain. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="31" stitchTiles="stitch" result="folds"/>
      <feDiffuseLighting in="folds" surfaceScale="6" diffuseConstant="1" lightingColor="#ffffff" result="lit">
        <feDistantLight azimuth="235" elevation="58"/>
      </feDiffuseLighting>
      <feColorMatrix in="lit" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey">
        <feFuncR type="linear" slope="6.0" intercept="-5.088"/>
        <feFuncG type="linear" slope="6.0" intercept="-5.088"/>
        <feFuncB type="linear" slope="6.0" intercept="-5.088"/>
      </feComponentTransfer>
    </filter>
    <filter id="eudaimonia-tooth" x="0" y="0" width="100%" height="100%">
      <!-- The stock's own grain, a whisper under the crinkle. -->
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <!-- Turbulence IS centred on 0.5, so this half keeps that centre.
           Alpha is forced opaque: fractalNoise emits noisy alpha too, which
           would modulate the layer twice and only ever lighten. -->
      <feComponentTransfer in="grey">
        <feFuncR type="linear" slope="1.6" intercept="-0.8"/>
        <feFuncG type="linear" slope="1.6" intercept="-0.8"/>
        <feFuncB type="linear" slope="1.6" intercept="-0.8"/>
        <feFuncA type="linear" slope="0" intercept="1"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="420" height="420" filter="url(#eudaimonia-crinkle)" opacity="0.040"/>
  <rect width="420" height="420" filter="url(#eudaimonia-broad)" opacity="0.03"/>
  <rect width="420" height="420" filter="url(#eudaimonia-tooth)" opacity="0.012"/>
</svg>
